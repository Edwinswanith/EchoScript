<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocalKey - Activation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .activation-container {
      width: 100%;
      max-width: 600px;
      padding: 32px;
    }

    .activation-feature-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 48px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .activation-feature-card:hover {
      border-color: #ccc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .activation-feature-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
      width: 100%;
    }

    .activation-feature-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .activation-feature-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .activation-feature-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .activation-feature-description {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 500px;
    }

    .toggle-switch {
      position: relative;
      width: 60px;
      height: 32px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 32px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: #333;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(28px);
    }

    input:disabled + .toggle-slider {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .activation-feature-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
    }

    .activation-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ccc;
    }

    .activation-status-dot.active {
      background-color: #10b981;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="activation-container">
    <div class="activation-feature-card">
      <div class="activation-feature-header">
        <div class="activation-feature-title">
          <span class="activation-feature-icon">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          </span>
          <span>EchoScript</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="sttMicToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="activation-feature-status">
        <span class="activation-status-dot" id="sttMicStatus"></span>
        <span id="sttMicStatusText">Mic Off</span>
      </div>
      <div id="microphoneWarning" style="display: none; margin-top: 16px; padding: 12px; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; color: #92400e; font-size: 14px; text-align: center;">
        <strong>⚠️ Microphone Not Available</strong>
        <p id="microphoneWarningText" style="margin-top: 8px; margin-bottom: 0;">No microphone device detected. Please connect a microphone to use speech recognition.</p>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
